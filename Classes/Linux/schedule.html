<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Course Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon: #7A0019;
            --maroon-dark: #5E0013;
            --gold: #FDB71A;
            --maroon-tint: #FBF1F3;
            --gold-tint: #FEF6E3;
            --ink: #1A1A1A;
            --muted: #555555;
            --page-bg: #F5F5F5;
            --card-bg: #FFFFFF;
            --border: #E6E6E6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--page-bg);
            color: var(--ink);
            line-height: 1.65;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 0;
        }

        /* ---------- Header ---------- */
        header {
            background-color: var(--maroon);
            color: #fff;
            text-align: center;
            padding: 52px 24px 44px;
            border-radius: 12px;
            margin-bottom: 36px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        }

        header .eyebrow {
            font-family: 'Poppins', Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gold);
            margin: 0 0 14px;
        }

        header h1 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.3rem);
            line-height: 1.1;
            margin: 0;
            color: #fff;
        }

        header .gold-rule {
            width: 92px; height: 4px;
            background: var(--gold);
            border: 0; border-radius: 2px;
            margin: 20px auto 16px;
        }

        header .subtitle {
            font-size: 1.2rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.92);
        }

        /* ---------- Schedule card ---------- */
        .schedule-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
            padding: 40px;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Poppins', Arial, sans-serif;
            color: var(--maroon);
            font-size: 1.7rem;
            font-weight: 600;
            margin: 0 0 22px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--gold);
        }

        .class-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .info-item { flex-basis: 48%; margin-bottom: 6px; }
        .info-item p { margin: 0; font-size: 1.02rem; }
        .info-item strong { color: var(--maroon); }
        @media (max-width: 768px) { .info-item { flex-basis: 100%; } }

        /* ---------- Schedule table ---------- */
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 22px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            overflow: hidden;
        }

        .schedule-table th {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 600;
            background-color: var(--maroon);
            color: #fff;
            padding: 14px 15px;
            text-align: left;
            font-size: 0.98rem;
        }

        .schedule-table td {
            padding: 13px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.98rem;
            vertical-align: top;
        }

        .schedule-table tbody tr:nth-child(even) { background-color: var(--maroon-tint); }
        .schedule-table tbody tr:hover { background-color: var(--gold-tint); }

        .exam-row { font-weight: 600; }
        .in-person { color: var(--maroon); font-style: italic; font-weight: 600; }
        .break-row { background-color: #F0F0F0; font-style: italic; color: var(--muted); }

        .note {
            margin-top: 26px;
            padding: 16px 18px;
            background-color: var(--maroon-tint);
            border-radius: 8px;
            border-left: 4px solid var(--gold);
        }
        .note p { margin: 0; }
        .note strong { color: var(--maroon); }

        /* ---------- States ---------- */
        .error-container {
            text-align: center;
            padding: 40px;
            background-color: var(--maroon-tint);
            border-radius: 12px;
            margin-top: 40px;
        }
        .error-container h2 {
            color: var(--maroon);
            border: 0;
            display: inline-block;
        }

        .loading-spinner { text-align: center; padding: 60px 40px; }
        .loading-spinner::after {
            content: "";
            display: inline-block;
            width: 42px; height: 42px;
            border: 6px solid var(--maroon-tint);
            border-top: 6px solid var(--maroon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            background-color: var(--maroon);
            color: #fff;
            text-align: center;
            padding: 22px;
            margin-top: 44px;
        }
        footer p { margin: 0; font-size: 0.95rem; }

        @media (max-width: 600px) {
            .schedule-container { padding: 26px 20px; }
            header { padding: 40px 18px 34px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .schedule-table tbody tr { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div class="loading-spinner" id="loading-spinner"></div>
    </div>

    <script>
        // Function to parse date string (M/D/YYYY format)
        function parseDate(dateStr) {
            const parts = dateStr.split('/');
            return new Date(parseInt(parts[2]), parseInt(parts[0]) - 1, parseInt(parts[1]));
        }

        // Function to format date as M/D/YYYY
        function formatDate(date) {
            return `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()}`;
        }

        // Function to add days to a date
        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        // Function to generate HTML content
        function generateScheduleHTML(data) {
            const container = document.getElementById('main-container');
            
            // Create header
            const header = document.createElement('header');
            header.innerHTML = `
                <p class="eyebrow">Mid-State Technical College &middot; IT Programs</p>
                <h1>${data.courseInfo.name}</h1>
                <hr class="gold-rule">
                <p class="subtitle">Course Schedule &mdash; ${data.courseInfo.term}</p>
            `;
            
            // Create schedule container
            const scheduleContainer = document.createElement('div');
            scheduleContainer.className = 'schedule-container';
            scheduleContainer.innerHTML = `
                <h2>Class Schedule</h2>
                
                <div class="class-info">
                    <div class="info-item">
                        <p><strong>Course:</strong> ${data.courseInfo.name}</p>
                    </div>
                    <div class="info-item">
                        <p><strong>Term:</strong> ${data.courseInfo.term}</p>
                    </div>
                    <div class="info-item">
                        <p><strong>Location:</strong> ${data.courseInfo.location}</p>
                    </div>
                    <div class="info-item">
                        <p><strong>Meeting Time:</strong> ${data.courseInfo.meetingTime}</p>
                    </div>
                </div>
            `;
            
            // Create schedule table
            const table = document.createElement('table');
            table.className = 'schedule-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Week</th>
                        <th>Unit</th>
                        <th>Content</th>
                        <th>Week of</th>
                        <th>Content Due</th>
                    </tr>
                </thead>
                <tbody id="schedule-tbody"></tbody>
            `;
            
            scheduleContainer.appendChild(table);
            
            // Add note
            const note = document.createElement('div');
            note.className = 'note';
            note.innerHTML = `
                <p><strong>Note:</strong> All assignments are due by midnight of the due date. In-person attendance is required for the Midterm Exam, Final Exam Interview, and Final Presentation.</p>
            `;
            
            scheduleContainer.appendChild(note);
            
            // Create footer
            const footer = document.createElement('footer');
            const year = new Date().getFullYear();
            footer.innerHTML = `
                <p>&copy; ${year} Mid-State Technical College. All Rights Reserved.</p>
            `;
            
            // Clear loading spinner and add elements to container
            container.innerHTML = '';
            container.appendChild(header);
            container.appendChild(scheduleContainer);
            container.appendChild(footer);
            
            // Set page title
            document.getElementById('page-title').textContent = `${data.courseInfo.name} - Course Schedule`;
            
            // Populate schedule with auto-calculated dates
            const scheduleBody = document.getElementById('schedule-tbody');
            
            // Parse initial dates
            let currentStartDate = parseDate(data.schedule.firstWeekStartDate);
            let currentDueDate = parseDate(data.schedule.firstWeekDueDate);
            
            // Parse last due date
            let lastDueDate = null;
            if (data.schedule.lastDueDate) {
                lastDueDate = parseDate(data.schedule.lastDueDate);
            }
            
            data.weeks.forEach((week, index) => {
                const row = document.createElement('tr');
                
                // Add class for special rows
                if (week.isBreak) {
                    row.classList.add('break-row');
                } else if (week.requiresInPerson) {
                    row.classList.add('exam-row');
                }
                
                // Format dates based on week type
                let weekStartFormatted = week.isBreak ? formatDate(currentStartDate) : formatDate(currentStartDate);
                let dueDateFormatted = '';
                
                // For the last week, use the specified lastDueDate if available
                if (week.isLastWeek && lastDueDate) {
                    dueDateFormatted = formatDate(lastDueDate);
                } else if (!week.isBreak) {
                    dueDateFormatted = formatDate(currentDueDate);
                }
                
                // Create row content
                row.innerHTML = `
                    <td>${week.weekNum || ''}</td>
                    <td>${week.unit || ''}</td>
                    <td>${week.content}${week.requiresInPerson ? ' - <span class="in-person">Please be in person</span>' : ''}</td>
                    <td>${weekStartFormatted}</td>
                    <td>${dueDateFormatted}</td>
                `;
                
                scheduleBody.appendChild(row);
                
                // Calculate dates for next week (add 7 days)
                // If this is a break week marked with skipWeek, we still increment the date
                currentStartDate = addDays(currentStartDate, 7);
                currentDueDate = addDays(currentDueDate, 7);
            });
        }

        // Function to handle errors
        function showError(message) {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="error-container">
                    <h2>Error Loading Schedule</h2>
                    <p>${message}</p>
                    <p>Please try again later or contact the administrator.</p>
                </div>
            `;
        }

        // Load schedule data using relative path (same origin)
        document.addEventListener('DOMContentLoaded', function() {
            // Use relative path to schedule.json in the same repository
            const jsonUrl = './schedule.json';
            
            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    generateScheduleHTML(data);
                })
                .catch(error => {
                    console.error('Error loading schedule data:', error);
                    showError('Could not load the schedule data from the server.');
                });
        });
    </script>
</body>
</html>
